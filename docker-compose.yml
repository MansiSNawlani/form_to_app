name: befischung

services:
  db:
    # Pinned rather than :latest so every machine and every rebuild gets the same
    # database. PostGIS is present from v1 but unused until feature 18.
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Exposed so uvicorn can be run directly on the host against the same
      # database, which is the faster loop while developing the backend.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on first initialisation of an empty volume.
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The backend waits on this, so it must mean "ready for queries", not
      # merely "process started".
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      # The form definition is checked in under database/seed/, outside the
      # backend's own context. Named here rather than widening the context to the
      # repository root, which would drag frontend/ and node_modules/ through the
      # daemon on every backend build.
      additional_contexts:
        seed: ./database/seed
    environment:
      # Built from the same credentials the database uses, but pointing at the
      # "db" service rather than localhost. This deliberately overrides the
      # host-facing DATABASE_URL in .env.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # No default and no fallback. The backend refuses to start without it,
      # which is the point: a signing key with a default in the repository is a
      # key everybody has.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env, see .env.example}
      SITZUNGSDAUER_STUNDEN: ${SITZUNGSDAUER_STUNDEN:-8}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Inside the container, where the anlagen volume is mounted. Not the host
      # default in .env.example: a path in a container layer is thrown away on
      # the next deploy, and this holds survey evidence.
      ANLAGEN_VERZEICHNIS: /srv/anlagen
    volumes:
      - anlagen:/srv/anlagen
    ports:
      - "8000:8000"
    depends_on:
      db:
        # Not just "started". Starting the backend against a database still
        # initialising would make its first readiness check fail for no reason.
        condition: service_healthy
    healthcheck:
      # Liveness, not readiness: this decides whether to restart the container,
      # and restarting will not fix a database that is down. The slim image has
      # no curl, so Python does the request.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  # Named, so survey data survives "docker compose down". project-overview.md
  # requires the database to be persistent and never ephemeral.
  pgdata:
  # The uploaded map excerpts and photographs, which are survey evidence exactly
  # as the answers are. Named for the same reason as pgdata: an anonymous volume
  # would be a fresh empty directory on every "up", and the pictures would be
  # gone with nothing reporting it. "docker compose down -v" deletes this too.
  anlagen:
