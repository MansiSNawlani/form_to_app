[project]
name = "befischung-backend"
version = "0.1.0"
description = "API for the Protokoll E-Befischung application"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    # A runtime dependency rather than a dev one, because migrating is a deploy
    # step run against a real environment, not something only developers do. A
    # deployment installing main dependencies only must still be able to migrate.
    "alembic>=1.14",
    # Argon2id, the current first recommendation for password storage. Used
    # directly rather than through a wrapper: it already offers the rehash check
    # that is the only thing a wrapper would add.
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    # scripts/extract_form_definition.py only. The legacy PDF is encrypted, so
    # pypdf needs cryptography to open it even though there is no password.
    "pypdf>=6.0",
    "cryptography>=44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["app", "scripts"]
python_files = ["*_test.py", "test_*.py"]
# An empty suite must fail rather than pass, so "no tests ran" never looks like "passed".
addopts = "--strict-markers"
