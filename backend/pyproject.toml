[project]
name = "befischung-backend"
version = "0.1.0"
description = "API for the Protokoll E-Befischung application"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    # A runtime dependency rather than a dev one, because migrating is a deploy
    # step run against a real environment, not something only developers do. A
    # deployment installing main dependencies only must still be able to migrate.
    "alembic>=1.14",
    # Argon2id, the current first recommendation for password storage. Used
    # directly rather than through a wrapper: it already offers the rehash check
    # that is the only thing a wrapper would add.
    "argon2-cffi>=23.1",
    # Signs and checks the session tokens. The maintained, minimal choice, and
    # the one jwt.io lists first for Python; python-jose appears in older FastAPI
    # tutorials and has had long gaps between releases.
    "pyjwt>=2.10",
    # Email syntax checking and normalisation. Pydantic uses the same library
    # behind EmailStr, so the browser side and this agree on what an address is.
    "email-validator>=2.2",
    # Reads multipart/form-data, which is how a file reaches an endpoint. FastAPI
    # refuses to start a route declaring UploadFile without it, with a message
    # naming this package, so it is a hard requirement rather than a nicety.
    "python-multipart>=0.0.20",
    # The command line. By the author of FastAPI and the conventional choice
    # here; gives help text, option validation and exit codes for free.
    "typer>=0.15",
    # Talks to whatever object store holds the attachments when there is no
    # persistent disk to hold them. A runtime dependency rather than an optional
    # one: which store runs is configuration, and a deployment that installs main
    # dependencies only must still be able to serve a photograph.
    #
    # The reference S3 client rather than an async wrapper. app/anlagen/speicher.py
    # already puts every blocking call behind asyncio.to_thread, so the S3 store
    # follows the pattern already in the file instead of introducing a second
    # concurrency story and a less-maintained dependency to go with it.
    "boto3>=1.35",
    # Reads and writes the legacy Acrobat form. A runtime dependency since
    # feature 23a: until then only scripts/extract_form_definition.py used it, to
    # pull the option lists out of the PDF once, but the application itself now
    # imports a filled-in protocol and hands one back for download, so the
    # service cannot start without it. cryptography comes with it because the
    # form FFS distributes is encrypted, and pypdf needs it to open the file even
    # though the password is empty.
    "pypdf>=6.0",
    "cryptography>=44",
    # Draws the PDF a submitter downloads. Feature 23e writes a document of our
    # own rather than filling the legacy form, so pypdf above, which reads and
    # fills existing forms, is the wrong tool for it.
    #
    # ReportLab rather than WeasyPrint, which would have laid the page out from
    # HTML and CSS. WeasyPrint needs Pango and Cairo installed as system
    # libraries: the container could carry them, but development here happens on
    # Windows and that is where pytest runs, so a document test would only ever
    # pass in Docker. This is a pure Python wheel and behaves the same in both
    # places. Pillow comes with it, and is what puts a photograph on a page.
    "reportlab>=4.2",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest-asyncio>=0.24",
    # An in-process S3, so the object store's tests actually run rather than
    # skipping everywhere a bucket is not configured. It serves real HTTP to real
    # botocore, so what they exercise is our calls and our error handling, not a
    # hand-written stub agreeing with itself.
    "moto[s3]>=5.0",
    # boto3 ships no types of its own, and mypy is a gate here. Without these the
    # S3 calls would be the one unchecked corner of the backend; with them a
    # wrong argument name is caught before it reaches a bucket, which is how the
    # delete_objects payload in speicher_s3.py was found to be the wrong shape.
    "boto3-stubs[s3]>=1.35",
]

# Lets an administrator run "befischung benutzer anlegen" rather than
# remembering a module path. Installed by pip install -e ".[dev]".
[project.scripts]
befischung = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

# ReportLab ships no type information and has no stub package on typeshed. The
# document builder is the only module that imports it, and it keeps the untyped
# surface to the few calls that draw the page; everything it hands over is typed.
[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["app", "scripts"]
python_files = ["*_test.py", "test_*.py"]
# An empty suite must fail rather than pass, so "no tests ran" never looks like "passed".
addopts = "--strict-markers"
# "auto" so an async test needs no marker of its own. The alternative is a
# decorator on every database test, and a forgotten one does not fail loudly:
# pytest collects the coroutine, never runs it, and reports a pass.
asyncio_mode = "auto"
# The test database is created and migrated once per run, so the fixture holding
# it outlives a single test and needs an event loop that does the same.
asyncio_default_fixture_loop_scope = "session"
# Tests share that loop rather than each getting their own. A database
# connection belongs to the loop it was opened on, so a session-lived connection
# pool and per-test loops cannot work together: the second test to run gets
# "attached to a different loop" instead of a connection.
asyncio_default_test_loop_scope = "session"
