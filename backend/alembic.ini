# Alembic configuration. Run from this directory, where the virtual environment
# lives; the migration scripts themselves live under database/, which is where
# coding-standards.md puts them.
#
# Trimmed from the generated template to only the settings this project sets. The
# rest are Alembic's documented defaults.

[alembic]
script_location = %(here)s/../database/migrations

# Makes the "app" package importable, so env.py can read the database URL from
# the application's own settings rather than keeping a second copy here.
prepend_sys_path = .
path_separator = os

# Date first, so "ls versions" reads in the order the migrations run rather than
# in the order of their random revision ids.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# There is deliberately no sqlalchemy.url here. env.py reads it from
# app.config.get_settings(), which already refuses to start on a missing or
# malformed value. A URL in this file would be a second place to configure the
# database, and a second place is how the two drift apart. It would also be a
# plausible place for somebody to paste a password into the repository.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
# Set to INFO to see the SQL a migration actually emits, which is the fastest way
# to check that a generated migration does what its Python says.
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
